name: Vendor fonts
# Throwaway branch: fetch OFL fonts (Noto Sans KR, Montserrat; fontsource variable builds) and publish to claude/vendor-font-out.
on:
  push:
    branches: [claude/vendor-font-tmp]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/w /tmp/out && cd /tmp/w
          for p in @fontsource-variable/noto-sans-kr@5.2.5 @fontsource-variable/montserrat@5.2.5; do npm pack "$p" || npm pack "${p%@*}"; done
          ls
          for t in *.tgz; do d=${t%.tgz}; mkdir -p $d && tar -xzf $t -C $d; done
          for d in */; do n=$(basename $d); mkdir -p /tmp/out/$n; cp $d/package/index.css /tmp/out/$n/ 2>/dev/null; cp $d/package/wght.css /tmp/out/$n/ 2>/dev/null; cp $d/package/LICENSE /tmp/out/$n/ 2>/dev/null; cp $d/package/package.json /tmp/out/$n/; mkdir -p /tmp/out/$n/files; cp $d/package/files/*wght-normal.woff2 /tmp/out/$n/files/ 2>/dev/null || cp $d/package/files/*.woff2 /tmp/out/$n/files/; done
          du -sh /tmp/out/*; ls /tmp/out/*/ | head -40
          cd /tmp/out
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json
          git init -q -b claude/vendor-font-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "fontsource Noto Sans KR + Montserrat variable"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/vendor-font-out
