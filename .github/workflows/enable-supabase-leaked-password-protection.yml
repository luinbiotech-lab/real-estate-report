name: Enable Supabase Leaked Password Protection

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: ENABLE LEAKED PASSWORD PROTECTION"
        required: true
        type: string
  push:
    branches:
      - master
    paths:
      - ".github/approvals/enable-supabase-leaked-password-protection.once"

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable leaked-password protection
        env:
          SUPABASE_PROJECT_REF: neeqcfxjwotyiodrlzvq
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          DAON_AUTH_SECURITY_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation || 'ENABLE LEAKED PASSWORD PROTECTION' }}
        run: node scripts/enable-supabase-leaked-password-protection.mjs
