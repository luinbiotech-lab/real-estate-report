name: Production Cutover Preflight

on:
  workflow_dispatch:
    inputs:
      production_base_url:
        description: "Optional HTTPS production origin. Leave blank before deployment."
        required: false
        type: string

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate cutover credentials and endpoint readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          DAON_PRODUCTION_OWNER_EMAIL: ${{ secrets.DAON_PRODUCTION_OWNER_EMAIL }}
          DAON_PRODUCTION_OWNER_PASSWORD: ${{ secrets.DAON_PRODUCTION_OWNER_PASSWORD }}
          DAON_PRODUCTION_BASE_URL: ${{ inputs.production_base_url }}
        run: node scripts/production-cutover-preflight.mjs

      - name: Production HTTP acceptance
        if: ${{ inputs.production_base_url != '' }}
        env:
          DAON_PRODUCTION_BASE_URL: ${{ inputs.production_base_url }}
        run: npm run test:prod-http

      - name: Safety summary
        if: always()
        run: |
          {
            echo "## DA:ON Production Cutover Preflight"
            echo "- Production write: NOT PERFORMED"
            echo "- Migration approval: NOT RECORDED BY THIS WORKFLOW"
            echo "- Use guarded deployment / auth-security / migration workflows after this preflight passes."
          } >> "$GITHUB_STEP_SUMMARY"
