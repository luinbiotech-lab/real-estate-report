name: SVG Semantic Pilot

on:
  push:
    branches:
      - feat/svg-semantic-pilot
  workflow_dispatch:

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite QA server
        run: |
          npm run dev:frontend -- --host 127.0.0.1 --port 4174 >/tmp/daon-svg-semantic.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daon-svg-semantic.log
          exit 1
      - name: Scan SVG semantic candidates
        run: node scripts/scan-svg-semantic-candidates.mjs
