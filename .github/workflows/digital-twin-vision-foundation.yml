name: Digital Twin Vision Foundation

on:
  push:
    branches:
      - feat/digital-twin-vision-foundation-v4
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Digital Twin vision foundation
        run: node scripts/validate-digital-twin-vision-foundation.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
