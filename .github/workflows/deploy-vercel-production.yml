name: Deploy DAON Production to Vercel

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: DEPLOY DAON PRODUCTION"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit deployment approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "DEPLOY DAON PRODUCTION" || {
            echo "Exact confirmation DEPLOY DAON PRODUCTION is required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require Vercel deployment secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install dependencies
        run: npm ci

      - name: Validate production contracts
        run: |
          npm run readiness:prod
          node scripts/validate-vercel-deployment.mjs
          npm run typecheck
          npm run lint

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.10.0

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production URL: $URL"

      - name: Production HTTP acceptance
        env:
          DAON_PRODUCTION_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:prod-http

      - name: Deployment summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## DA:ON Production Deploy"
            echo "- URL: $URL"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Contract validation: PASS"
            echo "- Production HTTP acceptance: PASS"
            echo "- Supabase Production migration: NOT AUTHORIZED BY THIS WORKFLOW"
          } >> "$GITHUB_STEP_SUMMARY"
