name: Sample Management 3D Demo QA

on:
  push:
    branches:
      - feat/sample-management-3d-demo
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start Vite QA server
        run: |
          VITE_REQUIRE_REMOTE_AUTH=false VITE_REMOTE_OPERATIONAL_MODE=false npm run dev:frontend -- --host 127.0.0.1 --port 4174 > /tmp/daon-sample-3d.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daon-sample-3d.log
          exit 1
      - name: Browser QA
        run: node scripts/visual-sample-3d-demo-smoke.mjs
