name: Excel Report Preflight

on:
  push:
    branches:
      - qa/excel-report-preflight
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Excel import security
        run: node scripts/validate-excel-security.mjs

      - name: Validate DAON report masters
        run: npm run validate:masters

      - name: Validate report pipeline
        run: npm run validate:pipeline

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Vite QA server
        run: |
          npm run dev:frontend -- --host 127.0.0.1 --port 4174 > /tmp/daon-preflight-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daon-preflight-vite.log
          exit 1

      - name: Excel bulk 250-row visual QA
        run: node scripts/visual-excel-bulk-smoke.mjs

      - name: Property list 250-row visual QA
        run: node scripts/visual-property-bulk-list-smoke.mjs

      - name: DAON report rendering QA
        run: node scripts/visual-report-smoke.mjs

      - name: Upload preflight screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excel-report-preflight
          path: |
            artifacts/agent-qa/
            artifacts/preflight-qa/
            artifacts/report-qa/
          if-no-files-found: ignore
