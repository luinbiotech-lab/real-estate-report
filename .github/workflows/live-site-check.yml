name: Live site check

# Read-only check of the Production site from GitHub's runner, so the result does not depend on the owner's PC.
# Triggered by pushing to the dedicated branch claude/live-monitor (no Production deploy: Vercel tracks master).
# Calls only public GET endpoints; no secret is used, printed or stored. Provider values are reported as observed
# (unverified evidence), never as confirmed facts.
on:
  push:
    branches: [claude/live-monitor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Target: Production by default; a preview URL may be set here temporarily to verify a PR before promotion.
      SITE: https://real-estate-report-lime.vercel.app
    steps:
      - name: Status and public-data discovery for the three test listings
        run: |
          set -u
          fails=0
          status=$(curl -sS -m 20 "$SITE/api/status" || echo '{}')
          echo "::notice title=Live status::$(echo "$status" | jq -c '{publicDataConfigured,vworldConfigured,naverConfigured,kakaoConfigured}' 2>/dev/null || echo "$status" | head -c 300)"
          for q in "서울특별시 마포구 동교로 212-22" "서울특별시 서초구 동광로1길 49" "서울특별시 강남구 논현로 339"; do
            enc=$(jq -rn --arg v "$q" '$v|@uri')
            body=$(curl -sS -m 40 -D /tmp/h "$SITE/api/property-discovery?query=$enc" || echo '{}')
            region=$(grep -i '^x-vercel-id' /tmp/h | tr -d '\r' | cut -d' ' -f2 | cut -d: -f1-3)
            summary=$(echo "$body" | jq -c '{status, publicDataConfigured, providers: (.providerStatus // {} | with_entries(.value = (if .value.ok then "ok" else (.value.error // "fail") end))), land: (.landProfile // {} | {pnu, officialLandPricePerSqm, landAreaSqm}), building: (.building // {} | {mainPurpsCdNm, totArea, grndFlrCnt, ugrndFlrCnt, useAprDay}), market: (.marketSummary // .market.summary // null)}' 2>/dev/null || echo "$body" | head -c 300)
            echo "::notice title=Live $q ($region)::$summary"
            failed=$(echo "$body" | jq -r '[.providerStatus // {} | to_entries[] | select(.value.ok != true) | "\(.key): \(.value.error // "fail")"] | join(", ")' 2>/dev/null || echo "응답 파싱 실패")
            if [ -n "$failed" ]; then echo "::error title=Live provider failure $q::$failed"; fails=$((fails+1)); fi
            # x-vercel-id = <edge region>::<function region>::id; the runner's edge is in the US, only the function region matters.
            fn_region=$(echo "$region" | awk -F'::' '{print $2}')
            if [ "$fn_region" != "icn1" ]; then echo "::error title=Live region $q::함수 리전이 서울(icn1)이 아님: $region"; fails=$((fails+1)); fi
          done
          echo "fails=$fails" >> "$GITHUB_ENV"
      - name: Transaction candidate composition (diagnosis, 논현로 339)
        run: |
          q=$(jq -rn --arg v "서울특별시 강남구 논현로 339" '$v|@uri')
          curl -sS -m 40 "$SITE/api/property-discovery?query=$q" > /tmp/d.json
          echo "::notice title=Market summary (논현로 339)::$(jq -c '.market.summary' /tmp/d.json)"
          for q2 in "서울특별시 마포구 동교로 212-22" "서울특별시 서초구 동광로1길 49"; do e2=$(jq -rn --arg v "$q2" '$v|@uri'); echo "::notice title=Market summary $q2::$(curl -sS -m 40 "$SITE/api/property-discovery?query=$e2" | jq -c '.market.summary')"; done
          for kind in commercial land; do
            echo "::notice title=Market $kind composition::$(jq -c --arg k "$kind" '.market[$k] as $r | {rows: ($r|length), byMatch: ($r|group_by(.matchLevel)|map({(.[0].matchLevel): length})|add), buildingType: ($r|map(.raw.buildingType // "-")|group_by(.)|map({(.[0]): length})|add), share: ($r|map(.raw.shareDealingType // "-")|group_by(.)|map({(.[0]): length})|add), cancelled: ($r|map(select((.raw.cdealType // "") != ""))|length), rawKeys: ($r[0].raw // {} | keys), sample: ($r[:4]|map({amt: .sourceDealAmountTenThousandWon, b: .buildingAreaSqm, l: .landAreaSqm, dong: .legalDong, jibun, use: .buildingUse, bt: .raw.buildingType, sh: .raw.shareDealingType, cd: .raw.cdealType}))}' /tmp/d.json | head -c 3000)"
          done
      - name: Comparable land unit price distribution (price-layer sample, 2026-11-01)
        run: |
          for q2 in "서울특별시 서초구 동광로1길 49" "서울특별시 마포구 동교로 212-22"; do
            e2=$(jq -rn --arg v "$q2" '$v|@uri')
            curl -sS -m 40 "$SITE/api/property-discovery?query=$e2" > /tmp/p.json
            echo "::notice title=Price sample $q2::$(jq -c '([.market.commercial[]?, .market.land[]?] | map(select(.comparableExclusion == null and (.landPricePerPyeong // 0) > 0))) as $c | ($c | map(.landPricePerPyeong) | sort) as $v | {land: (.landProfile // {} | {landAreaSqm, officialLandPricePerSqm, estimatedOfficialLandValue, standardYear}), summary: .market.summary, comparableRowsReturned: ($c|length), p25: (if ($v|length)>0 then $v[(($v|length)-1)*25/100|floor] else null end), p50: (if ($v|length)>0 then $v[(($v|length)-1)/2|floor] else null end), p75: (if ($v|length)>0 then $v[(($v|length)-1)*75/100|floor] else null end), rows: ($c | sort_by(.dealDate) | reverse | map({t: .type, d: .dealDate, dong: .legalDong, j: .jibun, amt: .dealAmount, l: .landAreaSqm, ppy: .landPricePerPyeong, use: .buildingUse}))}' /tmp/p.json | head -c 6000)"
          done
      - name: Public facts for the final report sample (동교로 212-22, read-only, 2026-11-02)
        run: |
          e2=$(jq -rn --arg v "서울특별시 마포구 동교로 212-22" '$v|@uri')
          curl -sS -m 40 "$SITE/api/property-discovery?query=$e2" > /tmp/f.json
          echo "::notice title=Sample facts::$(jq -c '{address: .address | {officialAddress, roadAddress, lotAddress, latitude, longitude}, propertyType: .propertyType | {type, label}, building: .building, landProfile: (.landProfile // {} | del(.raw)), zones: .landUseZones, floors: .floors}' /tmp/f.json | head -c 6000)"
      - name: R-ONE Open API discovery (sample mode, no key, read-only, 2026-11-03)
        run: |
          B=https://www.reb.or.kr/r-one
          curl -sS -m 30 "$B/portal/openapi/openApiListPage.do" -o /tmp/list.html || true
          echo "::notice title=R-ONE list page refs::$(grep -oE "[A-Za-z/_.-]*\.do[^\"' ]*" /tmp/list.html | sort -u | head -40 | tr '\n' ' ')"
          for js in $(grep -oE 'src="[^"]*openapi[^"]*\.js[^"]*"' /tmp/list.html | cut -d'"' -f2 | head -5); do curl -sS -m 20 "https://www.reb.or.kr$js" | grep -oE "[A-Za-z/_.-]*\.do" | sort -u | head -20 | sed "s#^#$js: #"; done | head -40 | while read l; do echo "::notice title=R-ONE js refs::$l"; done
          for svc in SttsApiTbl SttsApiTblItm SttsApiTblCls SttsApiTblData; do
            r=$(curl -sS -m 30 "$B/openapi/$svc.do?Type=json&pIndex=1&pSize=5" | head -c 1500)
            echo "::notice title=R-ONE $svc sample::$r"
          done
          for kw in 지가 상업용 매매가격지수 전세가격지수 임대; do
            enc=$(jq -rn --arg v "$kw" '$v|@uri')
            echo "::notice title=R-ONE table search $kw::$(curl -sS -m 30 "$B/openapi/SttsApiTbl.do?Type=json&STATBL_NM=$enc" | head -c 2500)"
          done
      - name: Fail the run when a provider or region check failed
        if: env.fails != '0'
        run: |
          echo "::error title=Live site check::${{ env.fails }} check(s) failed"
          exit 1
      - name: Repeated unit price diagnosis (Issue #37)
        run: |
          for q2 in "서울특별시 마포구 동교로 212-22" "서울특별시 서초구 동광로1길 49"; do
            e2=$(jq -rn --arg v "$q2" '$v|@uri')
            curl -sS -m 40 "$SITE/api/property-discovery?query=$e2" > /tmp/r.json
            echo "::notice title=Rows $q2::$(jq -c '[(.market.commercial + .market.land)[] | {t: .type, d: .dealDate, amt: .sourceDealAmountTenThousandWon, b: .buildingAreaSqm, l: .landAreaSqm, ppp: .pricePerPyeong, bt: .raw.buildingType, sh: .raw.shareDealingType, plot: .raw.plottageAr, deal: .raw.dealArea, bar: .raw.buildingAr}] | group_by(.ppp) | map(select(length > 1)) | .[:5]' /tmp/r.json | head -c 3500)"
            echo "::notice title=Building $q2::$(jq -c '{building: (.building // null | if . then (to_entries | map(select(.value != null and .value != "")) | from_entries) else null end), floors: (.floors // [] | length), status, buildingTitle: .providerStatus.buildingTitle}' /tmp/r.json | head -c 2500)"
          done

