name: SVG Floor Plan Preflight

on:
  push:
    branches:
      - feat/svg-floorplan-pilot
  workflow_dispatch:

jobs:
  svg-floorplan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start Vite QA server
        run: |
          npm run dev:frontend -- --host 127.0.0.1 --port 4174 > /tmp/daon-svg-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daon-svg-vite.log
          exit 1
      - name: Public-domain SVG floor plan QA
        run: node scripts/visual-svg-floorplan-smoke.mjs
